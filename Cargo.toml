[package]
name = "PlayBridgeADB"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.40"
ctor = "0.4.1"
image = "0.25.6"
imageproc = "0.25.0"
once_cell = "1.21.3"
open = "5.3.2"
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
spin_sleep = "1.3.1"
win-screenshot = "4.0.12"
windows = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55.0"
winrt-toast = "0.1.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "PlayBridgeExtras"
path = "src/bin/extras.rs"
