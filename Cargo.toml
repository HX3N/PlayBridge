[package]
name = "PlayBridgeADB"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
spin_sleep = "1"
win-screenshot = "4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
winrt-toast = "0.1"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
fast_image_resize = { version = "5", default-features = false, features = [
    "image",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
