[package]
name = "PlayBridge-adb"
version = "0.2.8"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25.6"
open = "5.3.2"
spin_sleep = "1.3.1"
chrono = "0.4.40"
windows = { version = "0.61.1", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winrt-toast = "0.1.1"
winreg = "0.55.0"
lazy_static = "1.5.0"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
