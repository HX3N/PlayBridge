[package]
name = "PlayBridgeADB"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
ctor = "0.6"
image = "0.25"
imageproc = "0.25"
once_cell = "1"
open = "5"
regex = "1"
spin_sleep = "1"
win-screenshot = "4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
winrt-toast = "0.1"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
fast_image_resize = { version = "5", features = ["image"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
