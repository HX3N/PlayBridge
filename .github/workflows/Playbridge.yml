name: PlayBridge

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Generate KST datetime-based version tag
        id: version_tag
        shell: pwsh
        run: |
          $kst = (Get-Date).AddHours(9).ToString("yyyy.MM.dd_HH.mm")
          echo "VERSION=$kst" >> $env:GITHUB_OUTPUT

      - name: info
        run: |
          echo "tag_name: v${{ steps.version_tag.outputs.VERSION }}"
          echo "release_name: v${{ steps.version_tag.outputs.VERSION }}"

      - name: Build
        run: cargo build --release --verbose

      - name: List build directory
        run: dir target\release\

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version_tag.outputs.VERSION }}
          release_name: v${{ steps.version_tag.outputs.VERSION }}
          draft: false
          prerelease: false

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/PlayBridge-adb.exe
          asset_name: PlayBridge-adb.exe
          asset_content_type: application/octet-stream
