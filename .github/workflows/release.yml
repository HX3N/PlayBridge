name: release PlayBridge

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Reuse an existing tag instead of minting a new datetime tag. Leave blank for the usual datetime version."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_release:
    if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve version tag
        id: version_tag
        shell: pwsh
        run: |
          $override = "${{ github.event.inputs.tag_override }}"
          if ($override) {
            # reuse an existing tag; strip leading 'v' to avoid doubling
            $version = $override -replace '^v', ''
          } else {
            $version = (Get-Date).AddHours(9).ToString("yyyy.MM.dd_HH.mm")
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: info
        run: |
          echo "tag_name: v${{ steps.version_tag.outputs.VERSION }}"
          echo "release_name: v${{ steps.version_tag.outputs.VERSION }}"

      - name: Build
        run: cargo build --release --verbose
        env:
          PLAYBRIDGE_VERSION: v${{ steps.version_tag.outputs.VERSION }}

      - name: List build directory
        run: dir target\release\

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version_tag.outputs.VERSION }}
          name: v${{ steps.version_tag.outputs.VERSION }}
          files: |
            target/release/PlayBridgeADB.exe
            target/release/external_renderer_ipc.dll
            tools/Install.bat

          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
